name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # This job only reads the tree — it never pushes. Leaving the token in
          # .git/config lets any later step (or an uploaded artifact) carry a
          # credential that nothing here needs.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:terms
      - run: npm run typecheck
      - run: npm run test:contracts
      - run: cargo build --manifest-path contracts-soroban/Cargo.toml --release --target wasm32v1-none
      - run: npm run test:agent-api:drift
      - run: npm run test:smoke
      - run: npm run build
